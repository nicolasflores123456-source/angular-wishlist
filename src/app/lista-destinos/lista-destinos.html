<div class="mb-3">

  <input
    type="text"
    class="form-control mb-2"
    placeholder="Nombre del destino turístico"
    #nombre
  >

  <input
    type="text"
    class="form-control mb-2"
    placeholder="URL de la imagen"
    #url
  >

  <button
    class="btn btn-primary mt-2"
    (click)="agregar(nombre.value, url.value)"
  >
    Agregar destino
  </button>

</div>

<ul class="row list-unstyled">

  <li
    *ngFor="let destino of destinos"
    class="col-md-4 mb-3"
  >

    <app-destino-viaje
      [nombre]="destino.nombre"
      [imagenUrl]="destino.imagenUrl">
    </app-destino-viaje>

  </li>

</ul>
