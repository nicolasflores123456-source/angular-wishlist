<div class="container mt-4">

  <header class="mb-4">

    <!-- Selector de idiomas -->
    <div class="d-flex justify-content-end mb-3">

      <div>
        <label
          for="idioma"
          class="form-label">
          Seleccionar idioma
        </label>

        <select
          id="idioma"
          class="form-select"
          [value]="idiomaActual"
          (change)="cambiarIdioma($event)">

          <option value="es">Español</option>
          <option value="en">English</option>
          <option value="fr">Français</option>

        </select>
      </div>

    </div>

    <h1 class="text-center">
      Angular Wish List
    </h1>

    <h2 class="text-center">
      Ruteo Avanzado
    </h2>

    <!-- Traducciones -->
    <div class="text-center mt-3">

      <h3>
        {{ 'HOLA' | translate }}
      </h3>

      <p>
        {{ 'BIENVENIDO' | translate }}
      </p>

    </div>

    <!-- Navegación -->
    <nav class="nav nav-pills justify-content-center mt-3">

      <a
        class="nav-link"
        routerLink="/home"
        routerLinkActive="active">
        Home
      </a>

      <a
        class="nav-link"
        routerLink="/destino"
        routerLinkActive="active">
        Destino
      </a>

      <a
        class="nav-link"
        routerLink="/vuelos"
        routerLinkActive="active">
        Vuelos
      </a>

      <a
        class="nav-link"
        routerLink="/reservas"
        routerLinkActive="active">
        Reservas
      </a>

      @if (!auth.isLoggedIn()) {
        <a
          class="nav-link"
          routerLink="/login"
          routerLinkActive="active">
          Login
        </a>
      }

      @if (auth.isLoggedIn()) {
        <a
          class="nav-link"
          routerLink="/protected"
          routerLinkActive="active">
          Área protegida
        </a>

        <button
          type="button"
          class="btn btn-outline-danger ms-3"
          (click)="logout()">
          Cerrar sesión
        </button>
      }

    </nav>

  </header>

  <hr>

  <router-outlet></router-outlet>

</div>

<hr class="my-4">

<div class="container mt-4">

  <h4>Fecha y hora actual</h4>

  <p>{{ time | async }}</p>

</div>
