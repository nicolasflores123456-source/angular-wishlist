<div class="card mb-3">

  @if (imagenUrl) {
    <img
      [src]="imagenUrl"
      class="card-img-top"
      [alt]="nombre"
      style="height: 200px; object-fit: cover;"
    >
  }

  <div class="card-body">

    <h3 class="card-title">
      Posición {{ posicion }}: {{ nombre }}
    </h3>

    <span *ngIf="esFavorito" class="badge bg-success mb-2">
      ★ PREFERIDO
    </span>

    <p ngNonBindable class="text-muted small">
      Ejemplo de interpolación: {{ nombre }}
    </p>

    <h5 class="mt-3">Servicios disponibles:</h5>

    <ul>
      @for (servicio of servicios; track $index) {
        <li>
          <span [ngSwitch]="servicio">

            <span *ngSwitchCase="'desayuno'" class="text-danger">
              {{ servicio }}
            </span>

            <span *ngSwitchCase="'piscina'" class="text-primary">
              {{ servicio }}
            </span>

            <span *ngSwitchDefault>
              {{ servicio }}
            </span>

          </span>
        </li>
      }
    </ul>

    <!-- Sistema de votación -->
    <div class="d-flex justify-content-center align-items-center gap-3 mt-3 mb-3">

      <button
        type="button"
        class="btn btn-outline-success btn-sm"
        (click)="votarPositivo()">

        <span class="material-icons d-block">
          thumb_up
        </span>

      </button>

      <span class="fw-bold">
        Votos: {{ votes }}
      </span>

      <button
        type="button"
        class="btn btn-outline-danger btn-sm"
        (click)="votarNegativo()">

        <span class="material-icons">
          thumb_down
        </span>

      </button>

    </div>

    <div class="d-flex justify-content-center align-items-center gap-3 mt-4 mb-3">

  <button
    type="button"
    class="btn btn-primary"
    (click)="seleccionarDestino()">
    Seleccionar
  </button>

  <a
    [routerLink]="['/destino']"
    class="btn btn-outline-primary">
    Ver detalle
  </a>

</div>

  </div>

</div>
