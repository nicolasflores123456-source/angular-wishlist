<div class="container mt-4">

  <h2 class="text-primary">
    Listado de reservas
  </h2>

  <p>
    Bienvenido al módulo de reservas de Angular Wishlist.
  </p>

  <h4 class="mt-4">
    Reservas disponibles
  </h4>

  <ul class="list-group mt-3">

    @for (reserva of api.getAll(); track reserva.id) {

      <li class="list-group-item">

        <strong>ID:</strong> {{ reserva.id }}

        <br>

        <strong>Nombre:</strong> {{ reserva.name }}

      </li>

    }

  </ul>

  <div class="d-flex gap-3 mt-4">

    <a
      routerLink="./10"
      class="btn btn-primary">
      Ir al detalle de la reserva 10
    </a>

    <a
      routerLink="/login"
      class="btn btn-outline-secondary">
      Ir al Login
    </a>

  </div>

</div>
